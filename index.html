<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu Físico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/scrollreveal"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Scrollbar for table */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f3f4f6;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #60a5fa;
      border-radius: 10px;
      border: 2px solid #f3f4f6;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
  <div id="root" class="flex-grow"></div>

  <script type="text/babel" data-type="module" data-presets="react,env">
    const { useState, useEffect, useRef } = React;
    const { BrowserRouter, Routes, Route, NavLink, useNavigate } = ReactRouterDOM;

    // Colors used:
    // Blue: #3b82f6 (blue-500)
    // Green Light: #86efac (green-300)
    // White: #ffffff
    // Gray Soft: #f3f4f6 (gray-100), #9ca3af (gray-400)

    // Navigation Component
    function Navbar() {
      const [menuOpen, setMenuOpen] = useState(false);

      // Close menu on route change
      const closeMenu = () => setMenuOpen(false);

      return (
        <nav className="fixed top-0 left-0 right-0 bg-white shadow-md z-50">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between h-16 items-center">
              <NavLink
                to="/"
                className="text-2xl font-semibold text-blue-600 select-none"
                onClick={closeMenu}
                aria-label="Meu Físico Home"
              >
                Meu Físico
              </NavLink>
              <div className="hidden md:flex space-x-8">
                <NavLink
                  to="/"
                  end
                  className={({ isActive }) =>
                    isActive
                      ? "text-blue-600 border-b-2 border-blue-600 pb-1 font-semibold"
                      : "text-gray-600 hover:text-blue-600 transition"
                  }
                  onClick={closeMenu}
                >
                  Dashboard
                </NavLink>
                <NavLink
                  to="/registrar"
                  className={({ isActive }) =>
                    isActive
                      ? "text-blue-600 border-b-2 border-blue-600 pb-1 font-semibold"
                      : "text-gray-600 hover:text-blue-600 transition"
                  }
                  onClick={closeMenu}
                >
                  Registrar Atividade
                </NavLink>
                <NavLink
                  to="/historico"
                  className={({ isActive }) =>
                    isActive
                      ? "text-blue-600 border-b-2 border-blue-600 pb-1 font-semibold"
                      : "text-gray-600 hover:text-blue-600 transition"
                  }
                  onClick={closeMenu}
                >
                  Histórico
                </NavLink>
              </div>
              <button
                className="md:hidden text-gray-600 hover:text-blue-600 focus:outline-none"
                aria-label="Abrir menu"
                onClick={() => setMenuOpen(!menuOpen)}
              >
                <i className={menuOpen ? "fas fa-times fa-lg" : "fas fa-bars fa-lg"}></i>
              </button>
            </div>
          </div>
          {menuOpen && (
            <div className="md:hidden bg-white border-t border-gray-200 shadow-md">
              <NavLink
                to="/"
                end
                className={({ isActive }) =>
                  (isActive ? "bg-blue-50 text-blue-600 font-semibold" : "text-gray-700") +
                  " block px-4 py-3 border-b border-gray-200"
                }
                onClick={closeMenu}
              >
                Dashboard
              </NavLink>
              <NavLink
                to="/registrar"
                className={({ isActive }) =>
                  (isActive ? "bg-blue-50 text-blue-600 font-semibold" : "text-gray-700") +
                  " block px-4 py-3 border-b border-gray-200"
                }
                onClick={closeMenu}
              >
                Registrar Atividade
              </NavLink>
              <NavLink
                to="/historico"
                className={({ isActive }) =>
                  (isActive ? "bg-blue-50 text-blue-600 font-semibold" : "text-gray-700") +
                  " block px-4 py-3"
                }
                onClick={closeMenu}
              >
                Histórico
              </NavLink>
            </div>
          )}
        </nav>
      );
    }

    // Utility: format date to dd/mm/yyyy
    function formatDate(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return "";
      return d.toLocaleDateString("pt-BR");
    }

    // Utility: format date yyyy-mm-dd for input value
    function formatDateInput(date) {
      if (!date) return "";
      const d = new Date(date);
      if (isNaN(d)) return "";
      return d.toISOString().split("T")[0];
    }

    // Hook to manage activities in localStorage
    function useActivities() {
      const [activities, setActivities] = useState(() => {
        try {
          const stored = localStorage.getItem("meuFisicoActivities");
          if (stored) return JSON.parse(stored);
          return [];
        } catch {
          return [];
        }
      });

      useEffect(() => {
        localStorage.setItem("meuFisicoActivities", JSON.stringify(activities));
      }, [activities]);

      return [activities, setActivities];
    }

    // Dashboard Page
    function Dashboard() {
      const [activities] = useActivities();

      // Calculate weekly summary (last 7 days)
      const today = new Date();
      const oneWeekAgo = new Date(today);
      oneWeekAgo.setDate(today.getDate() - 6);

      // Filter activities in last 7 days
      const last7DaysActivities = activities.filter((a) => {
        const d = new Date(a.date);
        return d >= oneWeekAgo && d <= today;
      });

      // Group by day (dd/mm)
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(oneWeekAgo);
        d.setDate(oneWeekAgo.getDate() + i);
        days.push(d);
      }

      // Sum minutes per day
      const minutesPerDay = days.map((day) => {
        const dayStr = day.toISOString().split("T")[0];
        const total = last7DaysActivities
          .filter((a) => a.date === dayStr)
          .reduce((acc, cur) => acc + Number(cur.duration), 0);
        return total;
      });

      // Total minutes and activities in last 7 days
      const totalMinutes = minutesPerDay.reduce((a, b) => a + b, 0);
      const totalActivities = last7DaysActivities.length;

      // Motivation phrases
      const motivations = [
        "Você está indo muito bem! Continue assim!",
        "Cada passo conta. Mantenha o foco!",
        "Seu esforço de hoje é seu sucesso de amanhã.",
        "Coragem! Seu corpo agradece.",
        "Atividade física é saúde. Vamos juntos!",
        "Você é mais forte do que pensa.",
        "Pequenas conquistas levam a grandes vitórias.",
      ];
      const motivation = motivations[today.getDate() % motivations.length];

      // Chart.js ref and config
      const chartRef = useRef(null);
      useEffect(() => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext("2d");
        if (!ctx) return;

        const chart = new Chart(ctx, {
          type: "bar",
          data: {
            labels: days.map((d) => d.toLocaleDateString("pt-BR", { weekday: "short", day: "numeric" })),
            datasets: [
              {
                label: "Minutos de treino",
                data: minutesPerDay,
                backgroundColor: "#3b82f6",
                borderRadius: 6,
                maxBarThickness: 40,
              },
            ],
          },
          options: {
            responsive: true,
            animation: {
              duration: 1000,
              easing: "easeOutQuart",
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  stepSize: 10,
                },
                grid: {
                  color: "#e5e7eb",
                },
              },
              x: {
                grid: {
                  display: false,
                },
              },
            },
            plugins: {
              legend: {
                display: false,
              },
              tooltip: {
                enabled: true,
                backgroundColor: "#2563eb",
                titleColor: "#fff",
                bodyColor: "#fff",
                cornerRadius: 6,
              },
            },
          },
        });

        return () => {
          chart.destroy();
        };
      }, [minutesPerDay]);

      // ScrollReveal effect
      useEffect(() => {
        ScrollReveal().reveal(".sr-fade", {
          distance: "20px",
          origin: "bottom",
          duration: 700,
          easing: "ease-in-out",
          interval: 150,
          reset: false,
        });
      }, []);

      return (
        <main className="pt-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
          <h1 className="text-3xl font-semibold text-blue-600 mb-6 sr-fade">Dashboard</h1>

          <section className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 sr-fade">
            <div className="bg-white rounded-xl shadow-md p-6 flex flex-col items-center">
              <img
                src="https://placehold.co/80x80/png?text=🏃‍♂️&font=Inter&font-size=48"
                alt="Ícone ilustrativo de pessoa correndo em estilo moderno e minimalista"
                className="mb-4"
                aria-hidden="true"
              />
              <p className="text-gray-500 font-medium mb-1">Total de minutos</p>
              <p className="text-3xl font-bold text-blue-600">{totalMinutes}</p>
            </div>
            <div className="bg-white rounded-xl shadow-md p-6 flex flex-col items-center">
              <img
                src="https://placehold.co/80x80/png?text=📅&font=Inter&font-size=48"
                alt="Ícone ilustrativo de calendário moderno e minimalista"
                className="mb-4"
                aria-hidden="true"
              />
              <p className="text-gray-500 font-medium mb-1">Número de atividades</p>
              <p className="text-3xl font-bold text-green-400">{totalActivities}</p>
            </div>
            <div className="bg-white rounded-xl shadow-md p-6 flex flex-col items-center text-center">
              <img
                src="https://placehold.co/80x80/png?text=💡&font=Inter&font-size=48"
                alt="Ícone ilustrativo de lâmpada simbolizando motivação e inspiração"
                className="mb-4"
                aria-hidden="true"
              />
              <p className="text-gray-500 font-medium mb-1">Motivação do dia</p>
              <p className="text-lg font-semibold text-gray-700">{motivation}</p>
            </div>
          </section>

          <section className="bg-white rounded-xl shadow-md p-6 sr-fade">
            <h2 className="text-xl font-semibold text-blue-600 mb-4">Resumo semanal de treinos</h2>
            <canvas ref={chartRef} aria-label="Gráfico de barras mostrando minutos de treino nos últimos 7 dias" role="img"></canvas>
          </section>

          <section className="mt-12 sr-fade">
            <h2 className="text-xl font-semibold text-blue-600 mb-4">Imagens ilustrativas de atividades físicas</h2>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
              <img
                src="https://images.unsplash.com/photo-1554284126-4e7a1a1a1a1a?auto=format&fit=crop&w=600&q=80"
                alt="Pessoa correndo em parque urbano com roupas esportivas modernas, céu azul e árvores ao fundo"
                className="rounded-lg shadow-md object-cover w-full h-48"
                loading="lazy"
              />
              <img
                src="https://images.unsplash.com/photo-1508609349937-5ec4ae374ebf?auto=format&fit=crop&w=600&q=80"
                alt="Pessoa caminhando em trilha natural com tênis esportivo, vegetação verde e luz suave do sol"
                className="rounded-lg shadow-md object-cover w-full h-48"
                loading="lazy"
              />
              <img
                src="https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=600&q=80"
                alt="Pessoa andando de bicicleta em estrada rural com capacete, roupas esportivas e céu claro"
                className="rounded-lg shadow-md object-cover w-full h-48"
                loading="lazy"
              />
            </div>
          </section>
        </main>
      );
    }

    // Registrar Atividade Page
    function Registrar() {
      const [activities, setActivities] = useActivities();
      const navigate = useNavigate();

      const [type, setType] = useState("");
      const [duration, setDuration] = useState("");
      const [date, setDate] = useState(formatDateInput(new Date()));
      const [notes, setNotes] = useState("");
      const [error, setError] = useState("");

      const activityTypes = [
        "Corrida",
        "Caminhada",
        "Bicicleta",
        "Natação",
        "Yoga",
        "Musculação",
        "Pilates",
        "HIIT",
        "Dança",
        "Alongamento",
      ];

      // ScrollReveal effect
      useEffect(() => {
        ScrollReveal().reveal(".sr-fade", {
          distance: "20px",
          origin: "bottom",
          duration: 700,
          easing: "ease-in-out",
          interval: 150,
          reset: false,
        });
      }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        setError("");

        if (!type) {
          setError("Por favor, selecione o tipo de atividade.");
          return;
        }
        if (!duration || isNaN(duration) || duration <= 0) {
          setError("Por favor, informe uma duração válida em minutos.");
          return;
        }
        if (!date) {
          setError("Por favor, selecione a data da atividade.");
          return;
        }

        const newActivity = {
          id: Date.now(),
          type,
          duration: Number(duration),
          date,
          notes: notes.trim(),
        };

        setActivities([newActivity, ...activities]);
        navigate("/historico");
      };

      return (
        <main className="pt-20 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
          <h1 className="text-3xl font-semibold text-blue-600 mb-6 sr-fade">Registrar Atividade</h1>
          <form
            onSubmit={handleSubmit}
            className="bg-white rounded-xl shadow-md p-8 space-y-6 sr-fade"
            noValidate
          >
            <div>
              <label htmlFor="type" className="block text-gray-700 font-medium mb-2">
                Tipo de atividade <span className="text-red-500">*</span>
              </label>
              <select
                id="type"
                value={type}
                onChange={(e) => setType(e.target.value)}
                className="w-full rounded-md border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                required
                aria-required="true"
              >
                <option value="" disabled>
                  Selecione uma atividade
                </option>
                {activityTypes.map((act) => (
                  <option key={act} value={act}>
                    {act}
                  </option>
                ))}
              </select>
            </div>

            <div>
              <label htmlFor="duration" className="block text-gray-700 font-medium mb-2">
                Duração (minutos) <span className="text-red-500">*</span>
              </label>
              <input
                type="number"
                id="duration"
                min="1"
                value={duration}
                onChange={(e) => setDuration(e.target.value)}
                className="w-full rounded-md border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                placeholder="Ex: 30"
                required
                aria-required="true"
              />
            </div>

            <div>
              <label htmlFor="date" className="block text-gray-700 font-medium mb-2">
                Data da atividade <span className="text-red-500">*</span>
              </label>
              <input
                type="date"
                id="date"
                value={date}
                onChange={(e) => setDate(e.target.value)}
                className="w-full rounded-md border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                max={formatDateInput(new Date())}
                required
                aria-required="true"
              />
            </div>

            <div>
              <label htmlFor="notes" className="block text-gray-700 font-medium mb-2">
                Notas (opcional)
              </label>
              <textarea
                id="notes"
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                rows="3"
                className="w-full rounded-md border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"
                placeholder="Ex: Me senti bem, clima agradável..."
              ></textarea>
            </div>

            {error && (
              <p className="text-red-600 font-semibold text-center" role="alert" aria-live="assertive">
                {error}
              </p>
            )}

            <button
              type="submit"
              className="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-full transition"
              aria-label="Salvar atividade"
            >
              Salvar Atividade
            </button>
          </form>

          <section className="mt-12 sr-fade">
            <h2 className="text-xl font-semibold text-blue-600 mb-4">Imagens ilustrativas de atividades físicas</h2>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
              <img
                src="https://images.unsplash.com/photo-1598970434795-0c54fe7c0642?auto=format&fit=crop&w=600&q=80"
                alt="Pessoa fazendo alongamento ao ar livre em parque com roupas esportivas e céu azul"
                className="rounded-lg shadow-md object-cover w-full h-48"
                loading="lazy"
              />
              <img
                src="https://images.unsplash.com/photo-1526403229747-0a3a1a1a1a1a?auto=format&fit=crop&w=600&q=80"
                alt="Pessoa pedalando bicicleta em estrada urbana com capacete e roupas esportivas"
                className="rounded-lg shadow-md object-cover w-full h-48"
                loading="lazy"
              />
              <img
                src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=600&q=80"
                alt="Pessoa correndo em trilha de montanha com roupas esportivas e céu nublado"
                className="rounded-lg shadow-md object-cover w-full h-48"
                loading="lazy"
              />
            </div>
          </section>
        </main>
      );
    }

    // Histórico Page
    function Historico() {
      const [activities, setActivities] = useActivities();

      // Sort activities by date desc, then by id desc
      const sortedActivities = [...activities].sort((a, b) => {
        if (a.date > b.date) return -1;
        if (a.date < b.date) return 1;
        if (a.id > b.id) return -1;
        if (a.id < b.id) return 1;
        return 0;
      });

      // ScrollReveal effect
      useEffect(() => {
        ScrollReveal().reveal(".sr-fade", {
          distance: "20px",
          origin: "bottom",
          duration: 700,
          easing: "ease-in-out",
          interval: 150,
          reset: false,
        });
      }, []);

      // Delete activity handler
      const handleDelete = (id) => {
        if (window.confirm("Tem certeza que deseja excluir esta atividade?")) {
          setActivities(activities.filter((a) => a.id !== id));
        }
      };

      return (
        <main className="pt-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
          <h1 className="text-3xl font-semibold text-blue-600 mb-6 sr-fade">Histórico</h1>

          {sortedActivities.length === 0 ? (
            <p className="text-gray-600 sr-fade">Nenhuma atividade registrada ainda.</p>
          ) : (
            <div className="overflow-x-auto rounded-xl shadow-md bg-white sr-fade">
              <table className="min-w-full divide-y divide-gray-200">
                <thead className="bg-blue-50">
                  <tr>
                    <th
                      scope="col"
                      className="px-6 py-3 text-left text-xs font-semibold text-blue-600 uppercase tracking-wider"
                    >
                      Tipo
                    </th>
                    <th
                      scope="col"
                      className="px-6 py-3 text-left text-xs font-semibold text-blue-600 uppercase tracking-wider"
                    >
                      Duração (min)
                    </th>
                    <th
                      scope="col"
                      className="px-6 py-3 text-left text-xs font-semibold text-blue-600 uppercase tracking-wider"
                    >
                      Data
                    </th>
                    <th
                      scope="col"
                      className="px-6 py-3 text-left text-xs font-semibold text-blue-600 uppercase tracking-wider"
                    >
                      Notas
                    </th>
                    <th scope="col" className="relative px-6 py-3">
                      <span className="sr-only">Excluir</span>
                    </th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-200">
                  {sortedActivities.map(({ id, type, duration, date, notes }) => (
                    <tr key={id} className="hover:bg-gray-50 transition">
                      <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{type}</td>
                      <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{duration}</td>
                      <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{formatDate(date)}</td>
                      <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-600 max-w-xs truncate" title={notes}>
                        {notes || "-"}
                      </td>
                      <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button
                          onClick={() => handleDelete(id)}
                          className="text-red-600 hover:text-red-800 transition rounded-full p-1"
                          aria-label={`Excluir atividade ${type} do dia ${formatDate(date)}`}
                          title="Excluir atividade"
                        >
                          <i className="fas fa-trash-alt"></i>
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <section className="mt-12 sr-fade">
            <h2 className="text-xl font-semibold text-blue-600 mb-4">Imagens ilustrativas de atividades físicas</h2>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
              <img
                src="https://images.unsplash.com/photo-1526401485004-0a3a1a1a1a1a?auto=format&fit=crop&w=600&q=80"
                alt="Pessoa fazendo exercícios de musculação em academia moderna com equipamentos e iluminação natural"
                className="rounded-lg shadow-md object-cover w-full h-48"
                loading="lazy"
              />
              <img
                src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80"
                alt="Pessoa praticando yoga em estúdio com luz suave e ambiente tranquilo"
                className="rounded-lg shadow-md object-cover w-full h-48"
                loading="lazy"
              />
              <img
                src="https://images.unsplash.com/photo-1517960413843-0aee8e2b8a6e?auto=format&fit=crop&w=600&q=80"
                alt="Pessoa correndo na praia ao pôr do sol com roupas esportivas e mar ao fundo"
                className="rounded-lg shadow-md object-cover w-full h-48"
                loading="lazy"
              />
            </div>
          </section>
        </main>
      );
    }

    // App Component with Router
    function App() {
      return (
        <BrowserRouter>
          <Navbar />
          <Routes>
            <Route path="/" element={<Dashboard />} />
            <Route path="/registrar" element={<Registrar />} />
            <Route path="/historico" element={<Historico />} />
            <Route path="*" element={<Dashboard />} />
          </Routes>
        </BrowserRouter>
      );
    }
